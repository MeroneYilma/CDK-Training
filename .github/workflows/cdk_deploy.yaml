name: CDK Deploy Workflow

on:   
  workflow_call: 
    inputs:
      json_file_path:
        description: 'Specifies the JSON file path.'
        required: true
        type: string
      json_file:
        description: 'Specifies the JSON Data file.'
        required: true
        type: string
      gh_environment:
        description: 'Specifies the GitHub deployment environment.'
        required: true
        type: string
      stack_name:
        description: 'Specifies the CloudFormation stack name.'
        required: true
        type: string
        
jobs:    
  CDK_DEPLOY: 
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh_environment }}
    permissions:
      id-token: write
      contents: write
    timeout-minutes: 90  # Increase the timeout to 60 minutes

    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Print inputs for debugging
        run: |
          echo "json_file_path: ${{ inputs.json_file_path }}"
          echo "json_file: ${{ inputs.json_file }}"
          echo "gh_environment: ${{ inputs.gh_environment }}"
          echo "stack_name: ${{ inputs.stack_name }}"

      - name: Use AWS Configure Custom Action
        id: aws_configure
        uses: MeroneYilma/CDK-Training/.github/actions/global/aws_github_auth@alpha
        with: 
          json_data_file: "./${{ inputs.json_file_path }}/${{ inputs.json_file }}.json"

      - name: Use AWS CDK Working Directory Custom Action
        id: cdk_directory
        uses: MeroneYilma/CDK-Training/.github/actions/global/cdk_directory@alpha
        with: 
          json_data_file: "./${{ inputs.json_file_path }}/${{ inputs.json_file }}.json"

      - name: Check if working directory exists
        run: |
          if [ ! -d "${{ steps.cdk_directory.outputs.working_directory_output }}" ]; then
            echo "Working directory does not exist: ${{ steps.cdk_directory.outputs.working_directory_output }}"
            mkdir -p "${{ steps.cdk_directory.outputs.working_directory_output }}"
            echo "Created missing directory: ${{ steps.cdk_directory.outputs.working_directory_output }}"
          fi

      - name: Install AWS CDK
        run: |
          npm install -g aws-cdk

      - name: Install Requirements 
        run: pip install -r requirements.txt
        working-directory: ${{ steps.cdk_directory.outputs.working_directory_output }}

      - name: List files for debugging
        run: ls -al ../../../${{ inputs.json_file_path }}/accounts/
        working-directory: ${{ steps.cdk_directory.outputs.working_directory_output }}

      - name: CDK Deploy
        run: cdk deploy -c filepath=../../../${{ inputs.json_file_path }}/${{ inputs.json_file }}.json --all --require-approval never
        working-directory: ${{ steps.cdk_directory.outputs.working_directory_output }}

      - name: Wait for CloudFormation stack to be stable
        run: |
          aws cloudformation wait stack-update-complete --stack-name ${{ inputs.stack_name }}
        continue-on-error: true

      # Commented out the Describe CloudFormation Stack Events command
      # - name: Describe CloudFormation Stack Events
      #   if: failure()
      #   run: |
      #     aws cloudformation describe-stack-events --stack-name ${{ inputs.stack_name }}
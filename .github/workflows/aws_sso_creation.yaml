name: CDK Deploy Workflow
on:   
  workflow_call: 
    inputs:
      json_file_path:
        description: 'Specifies the JSON file path.'
        required: true
        type: string
      json_file:
        description: 'Specifies the JSON Data file.'
        required: true
        type: string
      gh_environment:
        description: 'Specifies the GitHub deployment environment.'
        required: true
        type: string
        
jobs:    
  CDK_DEPLOY: 
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh_environment }}
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: write # This is required for actions/checkout 

    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Print inputs for debugging
        run: |
          echo "json_file_path: ${{ inputs.json_file_path }}"
          echo "json_file: ${{ inputs.json_file }}"
          echo "gh_environment: ${{ inputs.gh_environment }}"

      - name: Use AWS Configure Custom Action
        id: aws_configure
        uses: MeroneYilma/CDK-Training/.github/actions/global/aws_github_auth@alpha
        with: 
          json_data_file: "./${{ inputs.json_file_path }}/${{ inputs.json_file }}.json"

      - name: Use AWS CDK Working Directory Custom Action
        id: cdk_directory
        uses: MeroneYilma/CDK-Training/.github/actions/global/cdk_directory@alpha
        with: 
          json_data_file: "./${{ inputs.json_file_path }}/${{ inputs.json_file }}.json"

      - name: Install AWS CDK
        run: |
          npm install -g aws-cdk

      - name: Install Requirements 
        run: 'pip install -r requirements.txt'
        working-directory: ${{ steps.cdk_directory.outputs.working_directory_output }}

      - name: List files for debugging
        run: ls -al ../../../${{ inputs.json_file_path }}/
        working-directory: ${{ steps.cdk_directory.outputs.working_directory_output }}

      - name: Check CloudFormation stack status
        id: check_stack_status
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name AwsSSOGroupMappingStack --query "Stacks[0].StackStatus" --output text)
          echo "Stack status: $STACK_STATUS"
          echo "STACK_STATUS=$STACK_STATUS" >> $GITHUB_ENV
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Wait for CloudFormation stack to be stable
        if: env.STACK_STATUS != 'CREATE_COMPLETE' && env.STACK_STATUS != 'UPDATE_COMPLETE'
        run: |
          aws cloudformation wait stack-update-complete --stack-name AwsSSOGroupMappingStack || aws cloudformation wait stack-create-complete --stack-name AwsSSOGroupMappingStack
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: CDK Deploy
        run: cdk deploy -c filepath=../../../${{ inputs.json_file_path }}/${{ inputs.json_file }}.json --all --require-approval never
        working-directory: ${{ steps.cdk_directory.outputs.working_directory_output }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
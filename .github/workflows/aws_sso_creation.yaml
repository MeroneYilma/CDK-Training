name: 04 - AWS Account Creation and SSO Mapping CDK Deploy Trigger Workflow

on:
  workflow_dispatch:

env:
  ALPHA: true
  BETA: false
  RELEASE: false

permissions:
  contents: write
  id-token: write

jobs:
  SELECT_ENVIRONMENT:
    runs-on: ubuntu-latest
    steps:
      - name: Set Environment
        id: set-env
        run: |
          echo "ALPHA=$ALPHA" >> $GITHUB_ENV
          echo "BETA=$BETA" >> $GITHUB_ENV
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV

    outputs:
      ALPHA: ${{ env.ALPHA }}
      BETA: ${{ env.BETA }}
      RELEASE: ${{ env.RELEASE }}

  PROCESS_JSON_FILES:
    needs: [SELECT_ENVIRONMENT]
    runs-on: ubuntu-latest
    steps:
      - name: Set Deployment related JSON Files
        id: set_deployment_files
        shell: bash
        run: | 
          echo ALPHA_FILES='["accounts/Demo_Account22", "accounts/Demo_Account24"]' >> $GITHUB_ENV
          #echo ALPHA_FILES='["sso-groups/Demo_Account9_sso.json", "sso-groups/Demo_Account10_sso.json", "sso-groups/Demo_Account11_sso.json", "sso-groups/Demo_Account12_sso.json"]' >> $GITHUB_ENV
          echo BETA_FILES='[]' >> $GITHUB_OUTPUT
          echo RELEASE_FILES='[]' >> $GITHUB_OUTPUT
    outputs: 
      alpha_deployment_files_output: ${{ env.ALPHA_FILES }}
      beta_deployment_files_output: ${{ env.BETA_FILES }}
      release_deployment_files_output: ${{ env.RELEASE_FILES }}

  ALPHA:
    needs: [SELECT_ENVIRONMENT, PROCESS_JSON_FILES]
    if: needs.SELECT_ENVIRONMENT.outputs.ALPHA == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: CDK Deploy
        run: |
          filepaths=$(echo ${{ needs.PROCESS_JSON_FILES.outputs.alpha_deployment_files_output }} | jq -r '.[]' | paste -sd "," -)
          cdk deploy -c filepaths=${{ github.workspace }}/${filepaths} --all --require-approval never

  BETA:
    needs: [SELECT_ENVIRONMENT, PROCESS_JSON_FILES]
    if: needs.SELECT_ENVIRONMENT.outputs.BETA == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: CDK Deploy
        run: |
          filepaths=$(echo ${{ needs.PROCESS_JSON_FILES.outputs.beta_deployment_files_output }} | jq -r '.[]' | paste -sd "," -)
          cdk deploy -c filepaths=${{ github.workspace }}/${filepaths} --all --require-approval never

  RELEASE:
    needs: [SELECT_ENVIRONMENT, PROCESS_JSON_FILES]
    if: needs.SELECT_ENVIRONMENT.outputs.RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: CDK Deploy
        run: |
          filepaths=$(echo ${{ needs.PROCESS_JSON_FILES.outputs.release_deployment_files_output }} | jq -r '.[]' | paste -sd "," -)
          cdk deploy -c filepaths=${{ github.workspace }}/${filepaths} --all --require-approval never